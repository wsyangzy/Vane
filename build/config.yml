# Wails v3 Dev Mode Configuration
# Claude Request Forwarder

version: '3'

info:
  companyName: "Claude Request Forwarder"
  productName: "Claude Request Forwarder"
  productIdentifier: "com.claude-request-forwarder.desktop"
  description: "Claude API Request Forwarding Service"
  version: "7.8"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - build/bin
      - third_party
      - .idea
      - .vscode
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task dev:build
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run:dev
      type: primary
