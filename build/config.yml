# Wails v3 Dev Mode Configuration
# Vane

version: '3'

info:
  companyName: "Vane"
  productName: "Vane"
  productIdentifier: "io.github.wsyangzy.vane"
  description: "Local AI Gateway, Routing and Request Tracing"
  version: "1.0.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - build/bin
      - third_party
      - .idea
      - .vscode
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task dev:build
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run:dev
      type: primary
