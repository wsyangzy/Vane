# Wails v3 Linux Taskfile - Vane
# Linux-specific build, run, and package tasks
# Note: CGO_ENABLED=1 required for go-sqlite3

version: '3'

vars:
  VERSION: '{{default "1.0.1" .VERSION}}'
  COMMIT: '{{default "unknown" .COMMIT}}'
  BUILD_TIME: '{{now | date "2006-01-02T15:04:05Z07:00"}}'
  DEV: '{{default "false" .DEV}}'

tasks:
  build:
    summary: Builds the application for Linux
    vars:
      BUILD_FLAGS: >-
        {{if eq .DEV "true"}}
        -tags desktop -buildvcs=false -gcflags="all=-l"
        {{else}}
        -tags production,desktop -trimpath -buildvcs=false
        -ldflags="-w -s
        -X github.com/wsyangzy/Vane/internal/buildinfo.Version={{.VERSION}}
        -X github.com/wsyangzy/Vane/internal/buildinfo.Commit={{.COMMIT}}
        -X github.com/wsyangzy/Vane/internal/buildinfo.BuildTime={{.BUILD_TIME}}
        -X github.com/wsyangzy/Vane/internal/buildinfo.BuildMode=release"
        {{end}}
    env:
      CGO_ENABLED: "1"
    cmds:
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}" ./cmd/vane

  run:
    summary: Runs the built Linux application
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}"'

  run-dev:
    summary: Runs the dev build of Linux application
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}"'

  package:
    summary: Packages the Linux application (placeholder)
    deps:
      - build
    cmds:
      - echo "Linux packaging - binary at {{.BIN_DIR}}/{{.APP_NAME}}"
