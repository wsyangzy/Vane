# Wails v3 Common Taskfile - Vane
# Platform-independent tasks for frontend and code generation

version: '3'

tasks:
  install:frontend:deps:
    summary: Install frontend dependencies
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/*
    cmds:
      - npm install

  build:frontend:
    summary: Build the frontend project
    dir: frontend
    deps:
      - install:frontend:deps
    cmds:
      - npm run build

  dev:frontend:
    summary: Runs the frontend dev server
    dir: frontend
    deps:
      - install:frontend:deps
    cmds:
      - npm run dev:watch -- --port {{.VITE_PORT}} --strictPort

  generate:bindings:
    summary: Generates Wails v3 bindings
    cmds:
      - wails3 generate bindings -clean=true -f '-tags desktop' -names -d frontend/src/bindings ./cmd/vane

  generate:icons:
    summary: Generates platform icons from assets/vane.png
    cmds:
      - python scripts/assets/generate-icon.py

  go:mod:tidy:
    summary: Runs go mod tidy
    internal: true
    cmds:
      - go mod tidy
