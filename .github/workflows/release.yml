name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ASSET_NAME: Vane-windows-amd64.zip

jobs:
  metadata:
    name: Validate release tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version and release notes
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/release/prepare-release.ps1 -Tag $env:RELEASE_TAG

  ci:
    name: Release checks
    needs: metadata
    uses: ./.github/workflows/ci.yml

  build-windows:
    name: Build Windows release
    needs: [metadata, ci]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      COMMIT: ${{ github.sha }}
      GOFLAGS: -mod=readonly
      CGO_ENABLED: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download checked frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Install pinned build tools
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.96
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.5.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows
        run: wails3 task windows:build VERSION="$env:VERSION" COMMIT="$env:COMMIT"

      - name: Verify and package Windows
        run: |
          $exePath = "build/bin/Vane.exe"
          $assetPath = "build/bin/$env:ASSET_NAME"
          $version = (Get-Item -LiteralPath $exePath).VersionInfo
          if ($version.FileVersion -ne "$env:VERSION.0" -or $version.ProductVersion -ne $env:VERSION) {
            throw "Windows version resources do not match v$env:VERSION"
          }
          $output = (& $exePath -version | Out-String)
          $versionPattern = '(?m)^Version: ' + [regex]::Escape($env:VERSION) + '\r?$'
          if ($LASTEXITCODE -ne 0 -or -not [regex]::IsMatch($output, $versionPattern)) {
            throw "Windows executable did not report the release version"
          }
          Compress-Archive -LiteralPath $exePath -DestinationPath $assetPath -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $assetPath).Hash.ToLowerInvariant()
          "$hash  $env:ASSET_NAME" | Set-Content -LiteralPath "build/bin/checksums.txt" -Encoding ascii

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: vane-windows-amd64
          path: |
            build/bin/${{ env.ASSET_NAME }}
            build/bin/checksums.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build-windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vane-windows-amd64
          path: build/release/

      - name: Verify release checksums
        working-directory: build/release
        run: sha256sum --check checksums.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $notesPath = Join-Path $env:RUNNER_TEMP "vane-release-notes.md"
          ./scripts/release/prepare-release.ps1 -Tag $env:RELEASE_TAG -NotesPath $notesPath
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:RELEASE_TAG --repo $env:GH_REPO --title "Vane $env:RELEASE_TAG" --notes-file $notesPath
          } else {
            gh release create $env:RELEASE_TAG --repo $env:GH_REPO --verify-tag --title "Vane $env:RELEASE_TAG" --notes-file $notesPath
          }
          if ($LASTEXITCODE -ne 0) { throw "Unable to create or update GitHub release" }
          gh release upload $env:RELEASE_TAG "build/release/$env:ASSET_NAME" "build/release/checksums.txt" --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to upload GitHub release assets" }
