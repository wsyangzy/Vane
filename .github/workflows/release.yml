name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '20'
  ASSET_NAME: Claude-Request-Forwarder-windows-amd64.zip

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Get version
        shell: powershell
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            "VERSION=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            $shortSha = (git rev-parse --short HEAD).Trim()
            "VERSION=dev-$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Build Windows
        run: wails build -platform windows/amd64 -ldflags "-X main.version=${{ env.VERSION }}"

      - name: Package Windows
        shell: powershell
        run: |
          $exePath = "build/bin/Claude Request Forwarder.exe"
          $assetPath = "build/bin/${{ env.ASSET_NAME }}"

          if (-not (Test-Path -LiteralPath $exePath)) {
            throw "Windows executable not found: $exePath"
          }

          if (Test-Path -LiteralPath $assetPath) {
            Remove-Item -LiteralPath $assetPath -Force
          }

          Compress-Archive -Path $exePath -DestinationPath $assetPath
          Get-FileHash -Algorithm SHA256 -LiteralPath $assetPath |
            ForEach-Object { "$($_.Hash.ToLower())  ${{ env.ASSET_NAME }}" } |
            Set-Content -Path "build/bin/checksums.txt" -Encoding UTF8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-request-forwarder-windows-amd64
          path: |
            build/bin/${{ env.ASSET_NAME }}
            build/bin/checksums.txt

      - name: Create Gitea release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Net.Http

          $token = $env:RELEASE_TOKEN
          if ([string]::IsNullOrWhiteSpace($token)) {
            $token = $env:FALLBACK_TOKEN
          }
          if ([string]::IsNullOrWhiteSpace($token)) {
            throw "Missing release token. Set repository secret RELEASE_TOKEN with release write permission."
          }

          $repo = "${{ github.repository }}"
          $tag = "${{ github.ref_name }}"
          $serverUrl = "${{ github.server_url }}".TrimEnd("/")
          $apiUrl = $env:GITHUB_API_URL
          if ([string]::IsNullOrWhiteSpace($apiUrl)) {
            $apiUrl = "$serverUrl/api/v1"
          }
          $apiUrl = $apiUrl.TrimEnd("/")

          $headers = @{
            Authorization = "token $token"
            Accept = "application/json"
          }

          $releaseBody = @"
## Claude Request Forwarder $tag

### 下载

- Windows x64: ${{ env.ASSET_NAME }}

### 校验

同目录提供 checksums.txt。
"@

          $releasePayload = @{
            tag_name = $tag
            name = "Claude Request Forwarder $tag"
            body = $releaseBody
            draft = $false
            prerelease = $false
          } | ConvertTo-Json

          $releasesUrl = "$apiUrl/repos/$repo/releases"
          try {
            $release = Invoke-RestMethod `
              -Method Post `
              -Uri $releasesUrl `
              -Headers $headers `
              -ContentType "application/json; charset=utf-8" `
              -Body ([System.Text.Encoding]::UTF8.GetBytes($releasePayload))
          } catch {
            $statusCode = $null
            if ($_.Exception.Response) {
              $statusCode = [int]$_.Exception.Response.StatusCode
            }
            if ($statusCode -ne 409 -and $statusCode -ne 422) {
              throw
            }
            $release = Invoke-RestMethod `
              -Method Get `
              -Uri "$releasesUrl/tags/$tag" `
              -Headers $headers
          }

          function Remove-ExistingAsset {
            param(
              [Parameter(Mandatory = $true)] $Release,
              [Parameter(Mandatory = $true)] [string] $Name
            )

            if (-not $Release.assets) {
              return
            }

            foreach ($asset in $Release.assets) {
              if ($asset.name -eq $Name) {
                Invoke-RestMethod `
                  -Method Delete `
                  -Uri "$releasesUrl/$($Release.id)/assets/$($asset.id)" `
                  -Headers $headers | Out-Null
              }
            }
          }

          function Upload-ReleaseAsset {
            param(
              [Parameter(Mandatory = $true)] $Release,
              [Parameter(Mandatory = $true)] [string] $Path
            )

            $resolvedPath = (Resolve-Path -LiteralPath $Path).Path
            $fileName = Split-Path -Leaf $resolvedPath
            Remove-ExistingAsset -Release $Release -Name $fileName

            $uploadUrl = "$releasesUrl/$($Release.id)/assets?name=$([uri]::EscapeDataString($fileName))"
            $client = [System.Net.Http.HttpClient]::new()
            $fileStream = $null
            $multipart = $null

            try {
              $client.DefaultRequestHeaders.Authorization =
                [System.Net.Http.Headers.AuthenticationHeaderValue]::new("token", $token)
              $client.DefaultRequestHeaders.Accept.ParseAdd("application/json")

              $multipart = [System.Net.Http.MultipartFormDataContent]::new()
              $fileStream = [System.IO.File]::OpenRead($resolvedPath)
              $fileContent = [System.Net.Http.StreamContent]::new($fileStream)
              $fileContent.Headers.ContentType =
                [System.Net.Http.Headers.MediaTypeHeaderValue]::Parse("application/octet-stream")
              $multipart.Add($fileContent, "attachment", $fileName)

              $response = $client.PostAsync($uploadUrl, $multipart).GetAwaiter().GetResult()
              if (-not $response.IsSuccessStatusCode) {
                $body = $response.Content.ReadAsStringAsync().GetAwaiter().GetResult()
                throw "Upload failed for $fileName. Status: $($response.StatusCode). Body: $body"
              }
            } finally {
              if ($multipart) { $multipart.Dispose() }
              if ($fileStream) { $fileStream.Dispose() }
              $client.Dispose()
            }
          }

          Upload-ReleaseAsset -Release $release -Path "build/bin/${{ env.ASSET_NAME }}"
          Upload-ReleaseAsset -Release $release -Path "build/bin/checksums.txt"
