<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Request Forwarder</title>
    <meta name="description" content="Claude Request Forwarder 本地代理转发服务" />
    <style>
      /* 防止加载时的闪烁 */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #FAFAFA;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui;color:#666;">
        Loading...
      </div>
    </div>
    <script>
      // Wails v3: 确保 window._wails 在任何模块加载前就已存在
      // 这样 isWailsEnvironment() 从首次渲染开始就返回一致的值
      // @wailsio/runtime 之后会补充完整的属性
      window._wails = window._wails || {};
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
